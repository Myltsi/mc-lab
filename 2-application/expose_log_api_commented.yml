---
# Julkaisee log-api:n kiinteässä osoitteessa ulkoverkossa.
#
# scripts/forward_logs.py pyörii ohjauskoneella, joka ei näe konttien
# sisäverkkoa. Siksi verkkoon luodaan LXD:n network forward: OVN ottaa
# vastaan liikenteen osoitteessa forward_address ja ohjaa portin
# forward_port log-api-kontin sisäverkon osoitteeseen.
#
#   ohjauskone ──► 192.168.1.129:8080 ──network forward (OVN)──► log-api <sisä-IP>:8080
#
# Toisin kuin proxy-laite, forward ei ole sidottu yhteen nodeen: osoite
# pysyy samana, vaikka log-api siirtyisi toiselle nodelle. Forward näkyy
# web-GUI:ssa verkon Forwards-välilehdellä.
#
# Tämä on ainoa muutos MicroCloudiin. teardown.yml poistaa forwardin.
- name: Publish log-api for the log forwarder
  hosts: lxd_controller
  gather_facts: false

  # Kaikki säädettävät arvot ovat tässä. forward_logs.py lukee osoitteen ja
  # portin tästä tiedostosta, ja teardown.yml:ssä on sama forward_address.
  vars:
    # Vapaa osoite ulkoverkossa, jonka OVN-uplink sallii forwardeille
    # (tarkista: lxc network get UPLINK ipv4.routes).
    forward_address: 192.168.1.129
    # Klusterin OVN-verkko, jossa kontit ovat (tarkista: lxc network list).
    forward_network: default
    # Portti, jota log-api kuuntelee kontin sisällä.
    forward_port: 8080

  tasks:
    # log-api:n IPv4-osoite sisäverkossa (eth0), samalla tavalla kuin
    # lxd_containers-rooli sen lukee.
    - name: Read log-api state
      ansible.builtin.command: lxc list log-api --format json
      register: log_api_state
      changed_when: false

    - name: Pick log-api's internal IPv4 address
      ansible.builtin.set_fact:
        log_api_ip: >-
          {{ ((log_api_state.stdout | from_json)[0].state.network.eth0.addresses
              | selectattr('family', 'equalto', 'inet') | first).address }}

    # Tarkistetaan, onko forward-osoite jo olemassa, jotta playbookin voi
    # ajaa uudelleen ilman virhettä.
    - name: List network forwards
      ansible.builtin.command: lxc network forward list {{ forward_network }} --format csv
      register: network_forwards
      changed_when: false

    - name: Create the forward address
      ansible.builtin.command: lxc network forward create {{ forward_network }} {{ forward_address }}
      when: forward_address not in (network_forwards.stdout_lines | map('split', ',') | map('first') | list)
      changed_when: true

    # Katsotaan, mihin portti tällä hetkellä ohjautuu (tyhjä = ei mihinkään).
    - name: Read the forward
      ansible.builtin.command: lxc network forward show {{ forward_network }} {{ forward_address }}
      register: forward_config
      changed_when: false

    - name: Find the current target of the log-api port
      ansible.builtin.set_fact:
        current_target: >-
          {{ (forward_config.stdout | from_yaml).ports | default([], true)
             | selectattr('listen_port', 'equalto', forward_port | string)
             | map(attribute='target_address') | first | default('') }}

    # Uudelleen luotu log-api saa uuden sisä-IP:n, joten vanha sääntö poistetaan.
    - name: Remove a rule that points to an old log-api address
      ansible.builtin.command: >
        lxc network forward port remove {{ forward_network }} {{ forward_address }}
        tcp {{ forward_port }}
      when: current_target not in ['', log_api_ip]
      changed_when: true

    # Sääntö: <forward_address>:<forward_port> (tcp) -> <log-api:n sisä-IP>:<forward_port>
    - name: Forward the log-api port to the container
      ansible.builtin.command: >
        lxc network forward port add {{ forward_network }} {{ forward_address }}
        tcp {{ forward_port }} {{ log_api_ip }} {{ forward_port }}
      when: current_target != log_api_ip
      changed_when: true

    - name: Show the forward
      ansible.builtin.command: lxc network forward show {{ forward_network }} {{ forward_address }}
      register: forward_result
      changed_when: false

    - name: Print the forward
      ansible.builtin.debug:
        var: forward_result.stdout_lines
