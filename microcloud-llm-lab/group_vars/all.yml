---
# LXD / MicroCloud cluster settings
lxd_controller_host: mc1
lxd_storage_pool: remote
lxd_network: default

containers:
  - name: ollama
    target: mc1
    image: ubuntu:24.04
    profiles: [default]
  - name: log-api
    target: mc2
    image: ubuntu:24.04
    profiles: [default]
  - name: log-db
    target: mc3
    image: ubuntu:24.04
    profiles: [default]
  - name: log-ui
    target: mc4
    image: ubuntu:24.04
    profiles: [default]

ollama_model: qwen2.5:0.5b
ollama_port: 11434
log_api_port: 8080
log_db_port: 5432
log_ui_port: 8081
